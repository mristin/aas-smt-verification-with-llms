[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-smt-verification-with-llms"
# NOTE (mristin):
# Do not forget to update the CHANGELOG.rst and __init__.py!
version = "1.0.0rc3"

description = "Verify AAS Submodel Templates using Large Language Models."
readme = "README.rst"
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

authors = [
    { name = "Marko Ristin", email = "marko@ristin.ch" },
    { name = "Ina Steinmetz", email = "ina.steinmetz@iosb.fraunhofer.de" }
]

dependencies = [
    "icontract>=2,<3",
    # This version of requests must coincide with the type stubs below.
    "requests==2.32.4",
    "aas-core3.0>=1.1.2,<2",
    "aas-core3.1>=1,<2",
    # NOTE (mristin):
    # Only release candidates of the SDK for V3.2 are available at the moment, and
    # pip considers pre-releases only if the specifier mentions one explicitly.
    "aas-core3.2>=1.0.0rc2,<2",
    # This version of tqdm must coincide with the type stubs below.
    "tqdm==4.67.0",
    "openai==2.9.0",
]

[project.scripts]
aas-smt-verification-with-llms = "aas_smt_verification_with_llms.main:entry_point"

[project.urls]
repository = "https://github.com/mristin/aas-smt-verification-with-llms"

[tool.setuptools.packages.find]
include = ["aas_smt_verification_with_llms"]
# NOTE (mristin):
# The ``exclude`` here refers to the module names, not filesystem paths!
exclude = ["continuous_integration", "dev_scripts", "experiments", "tests"]
