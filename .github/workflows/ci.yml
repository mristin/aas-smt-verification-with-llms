name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  Check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@master

      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v2
        with:
          python-version: ${{matrix.python-version}}

      - name: Install the package with development dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e .
          pip3 install -e dev

      # NOTE (mristin):
      # We run this command to detect nasty errors such as import cycles early.
      - name: Run --help to check that the command works
        run: aas-smt-verification-with-llms --help

      - name: Run precommit
        run: |
          python3 dev/continuous_integration/precommit.py
